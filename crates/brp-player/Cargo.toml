[package]
name = "brp-player"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "brp-player"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
egui.workspace = true
egui-winit.workspace = true
rfd.workspace = true
png = "0.18"
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
interprocess.workspace = true

brp-media = { path = "../brp-media" }
brp-render = { path = "../brp-render" }
brp-ai = { path = "../brp-ai" }
brp-ocio = { path = "../brp-ocio" }
winit.workspace = true

[build-dependencies]
# The executable's icon (build.rs): the app icon's PNG decoded and re-encoded per size.
png = "0.18"
