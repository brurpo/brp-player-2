[package]
name = "brp-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
ash.workspace = true
ash-window.workspace = true
raw-window-handle.workspace = true
gpu-allocator.workspace = true
shaderc.workspace = true
crossbeam-channel.workspace = true
egui.workspace = true
egui-ash-renderer.workspace = true
brp-media = { path = "../brp-media" }

[dev-dependencies]
ffmpeg-sys-next.workspace = true
env_logger.workspace = true
winit.workspace = true
png = "0.18"

# HDR screens: is HDR on for the window's monitor, its peak and SDR white (hdr.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Devices_Display"] }
